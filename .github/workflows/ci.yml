# The robot that reviews before humans do.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
